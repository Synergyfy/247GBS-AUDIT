name: Security Guard

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked tree for injected payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository security guard
        run: node scripts/security-guard.mjs
